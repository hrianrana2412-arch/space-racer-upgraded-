<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEON RACER - TITAN</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00ffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container"></div>

    <div id="menu-overlay">
        <div id="left-panel">
            <h1>NEON RACER</h1>
            <div class="section">
                <h3>GARAGE</h3>
                <input type="color" id="shipColor" value="#00ffff">
                <button onclick="window.setShipModel('Interceptor')">Interceptor</button>
                <button onclick="window.setShipModel('Speeder')">Speeder</button>
                <button onclick="window.setShipModel('Tanker')">Tanker</button>
            </div>
            <div class="section">
                <h3>TRACKS</h3>
                <button onclick="window.selectTrack('Neon Circuit')">Neon Circuit</button>
                <button onclick="window.selectTrack('Hyper Loop')">Hyper Loop</button>
            </div>
            <button onclick="window.startGame()" id="start-btn">START RACE</button>
        </div>
    </div>

    <div id="ui-layer" class="hidden">
        <div id="speed-display">0 KM/H</div>
        <div id="nitro-ui-container">
             <div id="nitro-bar"></div>
        </div>
        
        <div class="control-group" id="steering-controls">
            <button class="game-btn" id="btn-left">◀</button>
            <button class="game-btn" id="btn-right">▶</button>
        </div>

        <div class="control-group" id="action-controls">
            <button class="game-btn nitro-btn" id="btn-nitro">NITRO</button>
            <button class="game-btn gas-btn" id="btn-gas">GAS</button>
        </div>
    </div>

    <div id="victory-screen" class="hidden">
        <h2>YOU WON</h2>
        <button onclick="location.reload()">REPLAY</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
