<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEON RACER - TITAN</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container"></div>
    <div id="menu-overlay">
        <div id="left-panel">
            <h1>NEON RACER</h1>
            <div class="section">
                <h3>GARAGE</h3>
                <input type="color" id="shipColor" value="#00ffff">
                <div class="grid">
                    <button onclick="window.setShip('Interceptor')">Interceptor</button>
                    <button onclick="window.setShip('Speeder')">Speeder</button>
                    <button onclick="window.setShip('Vanguard')">Vanguard</button>
                    <button onclick="window.setShip('Zenith')">Zenith</button>
                </div>
            </div>
            <div class="section">
                <h3>SECTOR SELECT</h3>
                <div class="grid" id="track-list"></div>
            </div>
            <button onclick="window.startGame()" id="start-btn">START RACE</button>
        </div>
    </div>

    <div id="ui-layer" class="hidden">
        <div id="speed-display">0 KM/H</div>
        <div id="nitro-ui"><div id="nitro-bar"></div></div>
        <div class="control-group" id="steering-controls">
            <button class="game-btn" id="btn-left">◀</button>
            <button class="game-btn" id="btn-right">▶</button>
        </div>
        <div class="control-group" id="action-controls">
            <button class="game-btn nitro-btn" id="btn-nitro">NITRO</button>
            <button class="game-btn gas-btn" id="btn-gas">GAS</button>
        </div>
    </div>

    <div id="win-screen" class="hidden">
        <div class="win-content">
            <h2 class="glow-text">VICTORY</h2>
            <p>RACE COMPLETED</p>
            <button onclick="location.reload()" class="retry-btn">REPLAY</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
