<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Neon Space Racer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
background:#050816;
overflow:hidden;
font-family:Arial,sans-serif;
color:white;
}
canvas{
display:block;
width:100vw;
height:100vh;
}
#hud{
position:fixed;
top:12px;
left:12px;
z-index:10;
display:flex;
gap:12px;
}
.panel{
background:rgba(0,0,0,0.45);
padding:12px;
border-radius:12px;
backdrop-filter:blur(8px);
border:1px solid rgba(255,255,255,0.1);
min-width:140px;
}
#menu{
position:fixed;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:16px;
background:linear-gradient(#060816,#0f1230);
z-index:20;
}
button{
padding:14px 24px;
border:none;
border-radius:12px;
background:#ff2f92;
color:white;
font-size:18px;
cursor:pointer;
}
.touch{
position:fixed;
bottom:20px;
width:70px;
height:70px;
border-radius:16px;
background:rgba(255,255,255,0.15);
display:flex;
justify-content:center;
align-items:center;
font-size:28px;
user-select:none;
}
#left{left:20px}
#right{left:110px}
#boost{right:20px;background:#00c8ff}
</style>
</head>
<body>

<div id="menu">
<h1 style="font-size:54px;color:#ff2f92">NEON SPACE RACER</h1>
<button onclick="startGame()">PLAY OFFLINE</button>
</div>

<div id="hud">
<div class="panel">
<div>Speed</div>
<div id="speed">0</div>
</div>
<div class="panel">
<div>Nitro</div>
<div id="nitro">100</div>
</div>
</div>

<div class="touch" id="left">◀</div>
<div class="touch" id="right">▶</div>
<div class="touch" id="boost">⚡</div>

<canvas id="game"></canvas>

<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');

function resize(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
}
resize();
window.addEventListener('resize',resize);

let started=false;

const keys={
left:false,
right:false,
up:false,
boost:false
};

const player={
x:0,
y:0,
angle:0,
speed:0,
nitro:100,
trail:[]
};

const camera={
x:0,
y:0,
zoom:1
};

const stars=[];
for(let i=0;i<220;i++){
stars.push({
x:(Math.random()-0.5)*5000,
y:(Math.random()-0.5)*5000,
s:Math.random()*3
});
}

const checkpoints=[];
const radius=900;
for(let i=0;i<28;i++){
const a=(Math.PI*2/28)*i;
checkpoints.push({
x:Math.cos(a)*radius,
y:Math.sin(a)*radius
});
}

let ai={
x:80,
y:80,
angle:0,
speed:7,
target:0
};

function startGame(){
document.getElementById('menu').style.display='none';
started=true;
requestAnimationFrame(loop);
}

document.addEventListener('keydown',e=>{
if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;
if(e.key==='ArrowRight'||e.key==='d')keys.right=true;
if(e.key==='ArrowUp'||e.key==='w')keys.up=true;
if(e.key===' ')keys.boost=true;
});

document.addEventListener('keyup',e=>{
if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;
if(e.key==='ArrowRight'||e.key==='d')keys.right=false;
if(e.key==='ArrowUp'||e.key==='w')keys.up=false;
if(e.key===' ')keys.boost=false;
});

function bindTouch(id,key){
const el=document.getElementById(id);
el.addEventListener('touchstart',e=>{
e.preventDefault();
keys[key]=true;
});
el.addEventListener('touchend',e=>{
e.preventDefault();
keys[key]=false;
});
}
bindTouch('left','left');
bindTouch('right','right');
bindTouch('boost','boost');

function updatePlayer(){

if(keys.left)player.angle-=0.05;
if(keys.right)player.angle+=0.05;

if(keys.up){
player.speed+=0.18;
}

let maxSpeed=10;

if(keys.boost && player.nitro>0){
maxSpeed=18;
player.speed+=0.35;
player.nitro-=0.6;
camera.zoom=1.08;
}else{
player.nitro=Math.min(100,player.nitro+0.12);
camera.zoom+= (1-camera.zoom)*0.08;
}

player.speed*=0.985;
player.speed=Math.min(player.speed,maxSpeed);

player.x+=Math.cos(player.angle)*player.speed;
player.y+=Math.sin(player.angle)*player.speed;

player.trail.push({
x:player.x,
y:player.y,
life:1
});

if(player.trail.length>80){
player.trail.shift();
}
}

function updateAI(){
const target=checkpoints[ai.target];
const dx=target.x-ai.x;
const dy=target.y-ai.y;
const desired=Math.atan2(dy,dx);

let diff=desired-ai.angle;
while(diff>Math.PI)diff-=Math.PI*2;
while(diff<-Math.PI)diff+=Math.PI*2;

ai.angle+=diff*0.05;

ai.x+=Math.cos(ai.angle)*ai.speed;
ai.y+=Math.sin(ai.angle)*ai.speed;

if(Math.hypot(dx,dy)<120){
ai.target=(ai.target+1)%checkpoints.length;
}
}

function drawTrack(){
ctx.strokeStyle='#3f4cff';
ctx.lineWidth=180;
ctx.shadowBlur=50;
ctx.shadowColor='#2cc8ff';

ctx.beginPath();
checkpoints.forEach((p,i)=>{
if(i===0)ctx.moveTo(p.x,p.y);
else ctx.lineTo(p.x,p.y);
});
ctx.closePath();
ctx.stroke();

ctx.strokeStyle='#ff2f92';
ctx.lineWidth=6;
ctx.shadowBlur=20;

ctx.beginPath();
checkpoints.forEach((p,i)=>{
if(i===0)ctx.moveTo(p.x,p.y);
else ctx.lineTo(p.x,p.y);
});
ctx.closePath();
ctx.stroke();
}

function drawShip(x,y,angle,color){
ctx.save();
ctx.translate(x,y);
ctx.rotate(angle);

ctx.shadowBlur=30;
ctx.shadowColor=color;

ctx.fillStyle=color;

ctx.beginPath();
ctx.moveTo(26,0);
ctx.lineTo(-18,-14);
ctx.lineTo(-10,0);
ctx.lineTo(-18,14);
ctx.closePath();
ctx.fill();

ctx.restore();
}

function drawStars(){
for(const s of stars){
const sx=s.x-camera.x*0.2;
const sy=s.y-camera.y*0.2;

ctx.fillStyle='white';
ctx.fillRect(sx,sy,s.s,s.s);

if(player.speed>12){
ctx.strokeStyle='rgba(255,255,255,0.5)';
ctx.beginPath();
ctx.moveTo(sx,sy);
ctx.lineTo(sx-player.speed*4,sy);
ctx.stroke();
}
}
}

function drawTrail(){
player.trail.forEach(t=>{
t.life-=0.015;
ctx.globalAlpha=t.life;
ctx.fillStyle='#00d0ff';
ctx.beginPath();
ctx.arc(t.x,t.y,8*t.life,0,Math.PI*2);
ctx.fill();
});
ctx.globalAlpha=1;
}

function loop(){

updatePlayer();
updateAI();

camera.x += (player.x-camera.x)*0.08;
camera.y += (player.y-camera.y)*0.08;

ctx.fillStyle='#050816';
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.save();

ctx.translate(canvas.width/2,canvas.height/2);
ctx.scale(camera.zoom,camera.zoom);
ctx.translate(-camera.x,-camera.y);

drawStars();
drawTrack();
drawTrail();

drawShip(ai.x,ai.y,ai.angle,'#ff4040');
drawShip(player.x,player.y,player.angle,'#00d0ff');

ctx.restore();

document.getElementById('speed').innerText=Math.floor(player.speed*20);
document.getElementById('nitro').innerText=Math.floor(player.nitro);

requestAnimationFrame(loop);
}
</script>
</body>
</html>
