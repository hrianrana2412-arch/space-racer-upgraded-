<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEON RACER: ASPHALT</title>
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="landscape-lock">PLEASE ROTATE DEVICE</div>
    
    <div id="splash-screen">
        <h1 class="logo">NEON<span>RACER</span></h1>
        <div class="loader"><div id="load-fill"></div></div>
    </div>

    <div id="game-container"></div>

    <div id="ui-layer" class="hidden">
        <div id="lb"></div>
        <div id="speedo">0<span>KM/H</span></div>
        <div id="nitro-gauge"><div id="nitro-fill"></div></div>
        
        <div class="controls-left">
            <button class="btn-circle" id="l-btn">◀</button>
            <button class="btn-circle" id="r-btn">▶</button>
        </div>
        <div class="controls-right">
            <button class="btn-rect nitro" id="n-btn">NITRO</button>
            <button class="btn-rect drive" id="g-btn">GAS</button>
        </div>
    </div>

    <div id="menu-overlay">
        <div class="panel">
            <h1>NEON RACER</h1>
            <div class="box">
                <h3>GARAGE</h3>
                <div class="grid">
                    <button onclick="window.setShip('Vanguard')">Vanguard</button>
                    <button onclick="window.setShip('Zenith')">Zenith</button>
                    <button onclick="window.setShip('Phantom')">Phantom</button>
                </div>
            </div>
            <button onclick="window.startGame()" class="start-big">START RACE</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
