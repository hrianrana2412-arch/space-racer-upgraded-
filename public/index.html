<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Space Racer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container"></div>

    <div id="menu-overlay">
        <h1>NEON RACER</h1>
        <div class="menu-card">
            <h3>GARAGE</h3>
            <input type="color" id="shipColor" value="#ff00ff">
            <button onclick="setShipModel('Interceptor')">Interceptor</button>
            <button onclick="setShipModel('Speeder')">Speeder</button>
            <button onclick="setShipModel('Tanker')">Tanker</button>
        </div>
        <div class="menu-card">
            <button onclick="startGame('Neon Circuit')">START RACE</button>
            <button onclick="toggleMultiplayer()" id="multi-btn">MODE: OFFLINE</button>
        </div>
    </div>

    <div id="ui-layer" class="hidden">
        <div style="position:absolute; top:20px; right:20px; color:#0ff;">
            <div id="speed-display" style="font-size:40px;">0</div><div>KM/H</div>
        </div>
        <div style="position:absolute; bottom:20px; left:50%; transform:translateX(-50%); width:200px; height:10px; border:1px solid #f0f;">
            <div id="nitro-bar" style="width:100%; height:100%; background:#f0f;"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
