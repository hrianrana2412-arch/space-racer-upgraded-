<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEON RACER: TITAN-ASPHALT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="landscape-lock">PLEASE ROTATE DEVICE</div>
    
    <div id="splash-screen">
        <h1 class="logo-bright">NEON<span>RACER</span></h1>
        <p>TITAN PROTOCOL ACTIVE</p>
        <div class="loader"><div id="load-fill"></div></div>
    </div>

    <div id="game-container"></div>

    <div id="menu-overlay">
        <div class="panel">
            <h1 class="logo-bright">NEON<span>RACER</span></h1>
            <div class="garage-box">
                <h3>SELECT CRAFT</h3>
                <div class="ship-grid">
                    <button onclick="window.setShip('Vanguard')">VANGUARD</button>
                    <button onclick="window.setShip('Zenith')">ZENITH</button>
                    <button onclick="window.setShip('Phantom')">PHANTOM</button>
                </div>
            </div>
            <button id="start-btn" class="btn-main">INITIATE RACE</button>
        </div>
    </div>

    <div id="ui-layer" style="display: none;">
        <div id="hud-top"><b>POS 1/4</b></div>
        <div id="speedo">0<span>KM/H</span></div>
        <div id="nitro-bar"><div id="nitro-fill"></div></div>
        
        <div class="controls-left">
            <button class="ctrl-btn" id="l-btn">◀</button>
            <button class="ctrl-btn" id="r-btn">▶</button>
        </div>
        <div class="controls-right">
            <button class="ctrl-rect" id="n-btn">NITRO</button>
            <button class="ctrl-rect" id="g-btn">DRIVE</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
