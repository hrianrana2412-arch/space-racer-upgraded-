<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON SPACE RACER - PRO</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Orbitron', sans-serif; }
        #game-container { position: absolute; width: 100vw; height: 100vh; z-index: 1; }
        
        #menu-overlay {
            position: absolute; width: 100%; height: 100%; z-index: 100;
            display: flex; background: linear-gradient(90deg, rgba(0,0,0,0.9) 20%, rgba(0,0,0,0) 100%);
        }
        #left-panel { width: 350px; height: 100%; padding: 40px; display: flex; flex-direction: column; justify-content: center; pointer-events: auto; }
        
        .section { background: rgba(0, 255, 255, 0.05); border-left: 4px solid #0ff; padding: 15px; margin: 10px 0; }
        h1 { font-size: 2.5rem; color: #0ff; text-shadow: 0 0 20px #0ff; margin-bottom: 20px; }
        button {
            background: rgba(0,0,0,0.5); border: 1px solid #0ff; color: #0ff; padding: 10px; margin: 4px 0;
            width: 100%; cursor: pointer; font-family: 'Orbitron'; transition: 0.3s;
        }
        button:hover { background: #0ff; color: #000; box-shadow: 0 0 15px #0ff; }
        input[type="color"] { width: 100%; height: 30px; margin-top: 10px; cursor: pointer; }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; pointer-events: none; }
        #speed-display { position: absolute; top: 20px; right: 20px; font-size: 40px; color: #0ff; text-shadow: 0 0 10px #0ff; }
        #leaderboard { position: absolute; top: 20px; left: 20px; color: #fff; padding: 10px; border-left: 3px solid #f0f; background: rgba(0,0,0,0.5); }
        .hidden { display: none !important; }

        #victory-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 200;
            background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        #victory-screen h2 { font-size: 4rem; color: #ff0; text-shadow: 0 0 30px #ff0; }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <div id="menu-overlay">
        <div id="left-panel">
            <h1>NEON RACER</h1>
            <div class="section">
                <h3>GARAGE</h3>
                <input type="color" id="shipColor" value="#00ffff">
                <button onclick="window.setShipModel('Interceptor')">Interceptor</button>
                <button onclick="window.setShipModel('Speeder')">Speeder</button>
                <button onclick="window.setShipModel('Tanker')">Tanker</button>
            </div>
            <div class="section">
                <h3>TRACKS</h3>
                <button onclick="window.selectTrack('Neon Circuit')">Neon Circuit</button>
                <button onclick="window.selectTrack('Omega Void')">Omega Void (Short)</button>
                <button onclick="window.toggleMultiplayer()" id="multi-btn">MODE: OFFLINE</button>
            </div>
            <button onclick="window.startGame()" style="background:#0ff; color:#000; font-size:1.2rem;">START RACE</button>
        </div>
    </div>
    <div id="ui-layer" class="hidden">
        <div id="speed-display">0 KM/H</div>
        <div id="leaderboard"></div>
    </div>
    <div id="victory-screen" class="hidden">
        <h2>YOU WON!</h2>
        <button onclick="location.reload()">PLAY AGAIN</button>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
