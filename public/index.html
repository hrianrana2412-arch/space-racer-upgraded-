<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEON RACER - ULTIMATE</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Neon Racer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container"></div>

    <div id="menu-overlay">
        <div id="left-panel">
            <h1>NEON RACER</h1>
            
            <div class="section">
                <h3>GARAGE</h3>
                <input type="color" id="shipColor" value="#00ffff">
                <button onclick="window.setShipModel('Interceptor')">Interceptor</button>
                <button onclick="window.setShipModel('Speeder')">Speeder</button>
                <button onclick="window.setShipModel('Tanker')">Tanker</button>
            </div>

            <div class="section">
                <h3>CIRCUITS</h3>
                <button onclick="window.selectTrack('Neon Circuit')">Neon Circuit</button>
                <button onclick="window.selectTrack('Hyper Loop')">Hyper Loop (Short)</button>
                <button onclick="window.selectTrack('Deep Void')">Deep Void (Long)</button>
            </div>

            <div class="section">
                <button onclick="window.toggleMultiplayer()" id="multi-btn">MODE: OFFLINE</button>
                <button onclick="window.startGame()" style="background: #0ff; color: #000; font-weight: 900;">START RACE</button>
            </div>
        </div>
    </div>

    <div id="ui-layer" class="hidden">
        <div id="speed-display">0 KM/H</div>
        <div id="leaderboard"></div>
        <div id="nitro-bar-container">
            <div id="nitro-bar"></div>
        </div>
    </div>

    <div id="victory-screen" class="hidden">
        <h2>YOU WON</h2>
        <p>LEGENDARY PERFORMANCE</p>
        <button onclick="location.reload()">REPLAY</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
