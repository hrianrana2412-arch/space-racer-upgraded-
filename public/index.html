<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Space Racer 3D - Ultimate</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #menu-overlay { position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #0ff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .menu-card { background: rgba(0,255,255,0.05); border: 1px solid #0ff; padding: 20px; border-radius: 10px; margin: 10px; width: 300px; text-align: center; }
        button { background: #0ff; border: none; padding: 10px; margin: 5px; font-weight: bold; cursor: pointer; width: 80%; border-radius: 5px; transition: 0.3s; }
        button:hover { background: #fff; box-shadow: 0 0 15px #0ff; }
        input[type="color"] { width: 100%; height: 40px; cursor: pointer; border: none; background: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <div id="menu-overlay">
        <h1 style="letter-spacing: 5px; text-shadow: 0 0 20px #0ff;">NEON RACER</h1>
        
        <div class="menu-card">
            <h3>SHIP CUSTOMIZATION</h3>
            <label>Paint Color:</label>
            <input type="color" id="shipColor" value="#ff00ff">
            <label>Chassis:</label>
            <button onclick="setShipModel('Interceptor')">Interceptor</button>
            <button onclick="setShipModel('Speeder')">Speeder</button>
        </div>

        <div class="menu-card">
            <h3>SELECT TRACK</h3>
            <button onclick="startGame('Neon Circuit')">Neon Circuit</button>
            <button onclick="startGame('Asteroid Run')">Asteroid Run</button>
            <button onclick="startGame('Freeplay')">Freeplay (Infinite)</button>
        </div>
    </div>

    <div id="ui-layer" class="hidden">
        <div id="minimap-container"><canvas id="minimap"></canvas></div>
        <div id="telemetry">
            <div id="speed-display">0</div><div style="color:#0ff; font-size: 12px;">KM/H</div>
        </div>
        <div id="nitro-bar-container"><div id="nitro-bar"></div></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
